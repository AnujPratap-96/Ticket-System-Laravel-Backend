; Production PHP settings for DeskFlow
expose_php = Off
display_errors = Off
log_errors = On
error_log = /dev/stderr
memory_limit = 256M
max_execution_time = 60
upload_max_filesize = 2M
post_max_size = 2M
date.timezone = UTC

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
; Code never changes inside a running container, so skip file stat checks.
opcache.validate_timestamps = 0
