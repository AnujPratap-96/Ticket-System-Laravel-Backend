[www]
user = www-data
group = www-data
; Only nginx in the same container talks to php-fpm.
listen = 127.0.0.1:9000

; REQUIRED: without this php-fpm hides the container's environment variables (APP_KEY, DB_URL ...) from PHP.
clear_env = no

pm = dynamic
pm.max_children = 12
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500

catch_workers_output = yes
decorate_workers_output = no
